# The whole stack on one machine: PostgreSQL, the platform and the receiver simulator.
#
#   docker compose up --build        # dashboard at http://localhost:8080 (dev@localhost / local-dev-password)
#   docker compose up db             # only PostgreSQL, for running the backend from the command line
#
# The app runs with the "local" profile: well-known development secrets, plain-HTTP cookies and
# the simulator on the SSRF allowlist. Never expose this configuration publicly; see
# docs/DEPLOYMENT.md for production settings.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    image: webhook-platform:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/webhooks
      DATABASE_USERNAME: webhooks
      DATABASE_PASSWORD: webhooks
    ports:
      - "8080:8080"
    # SIGTERM first; the worker gets 20s to finish in-flight deliveries.
    stop_grace_period: 30s

  simulator:
    build:
      context: .
      target: simulator
    image: webhook-simulator:local
    ports:
      - "9090:9090"

volumes:
  pgdata:
