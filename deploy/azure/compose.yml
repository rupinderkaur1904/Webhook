# Relay on one Azure VM: Caddy (HTTPS) in front of the platform, PostgreSQL on Azure Database for
# PostgreSQL Flexible Server, and optionally the receiver simulator for demos.
# Deployment guide: docs/DEPLOYMENT-AZURE.md. Local development keeps using the root docker-compose.yml.
#
#   cp .env.example .env && ./new-secrets.sh    # once, on the VM
#   docker compose up -d                        # Caddy + platform
#   docker compose --profile demo up -d         # also the simulator (internal only)
#
# Nothing here publishes PostgreSQL or the simulator: only Caddy's 80 and 443 face the internet.
name: relay

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    <<: *hardening
    # caddy:2-alpine, pinned by digest (multi-arch index). Update: docker buildx imagetools inspect caddy:2-alpine
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    cap_add:
      # Binds 80 and 443 inside the container.
      - NET_BIND_SERVICE
    depends_on:
      app:
        condition: service_healthy
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    networks:
      edge:
        # The platform trusts X-Forwarded-For only from this address (TRUSTED_PROXIES below).
        ipv4_address: 172.30.0.2
    mem_limit: 128m

  app:
    <<: *hardening
    # ghcr.io/<owner>/webhook-platform@sha256:<digest>, from the "Images" workflow run on main.
    image: ${RELAY_APP_IMAGE:?set RELAY_APP_IMAGE in .env (an image digest, not a tag)}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-8}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?run new-secrets.sh}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?set BOOTSTRAP_EMAIL in .env}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?run new-secrets.sh}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?run new-secrets.sh}
      SSRF_ALLOWED_HOSTS: ${SSRF_ALLOWED_HOSTS:-}
      # Fixed for this deployment: only the owner signs in, cookies are Secure, Caddy is the only proxy.
      REGISTRATION_ENABLED: "false"
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_PROXIES: 172.30.0.2/32
      PROXY_DIAGNOSTICS: ${PROXY_DIAGNOSTICS:-false}
      LOG_FORMAT: ecs
      # A 1 GiB VM also runs Caddy and the OS: cap the heap instead of taking 75% of the container.
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx384m -Xss512k -XX:+ExitOnOutOfMemoryError}
    # Optional: short retry and circuit timings for live demos (see demo-timings.env.example).
    env_file:
      - path: demo-timings.env
        required: false
    tmpfs:
      - /tmp
    networks:
      edge:
        ipv4_address: 172.30.0.10
    mem_limit: 640m
    # SIGTERM first; the worker gets 20s to finish in-flight deliveries.
    stop_grace_period: 30s

  simulator:
    <<: *hardening
    profiles: ["demo"]
    image: ${RELAY_SIMULATOR_IMAGE:-}
    environment:
      SIMULATOR_CONTROL_TOKEN: ${SIMULATOR_CONTROL_TOKEN:?run new-secrets.sh}
      SIMULATOR_MAX_RECEIVERS: ${SIMULATOR_MAX_RECEIVERS:-20}
      JAVA_TOOL_OPTIONS: -Xmx128m -Xss512k -XX:+ExitOnOutOfMemoryError
    # Loopback only: reach it through an SSH tunnel (ssh -L 9090:127.0.0.1:9090 <vm>).
    ports:
      - "127.0.0.1:9090:9090"
    tmpfs:
      - /tmp
    networks:
      edge:
        ipv4_address: 172.30.0.20
    mem_limit: 256m

networks:
  edge:
    name: relay-edge
    driver_opts:
      com.docker.network.bridge.name: br-relay
    ipam:
      config:
        # egress-firewall.sh filters traffic leaving this subnet; keep the two in step.
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
