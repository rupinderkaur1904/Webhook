# Local rehearsal of the cloud stack, with a throwaway PostgreSQL in place of Azure's and Caddy's own
# local certificate authority in place of Let's Encrypt. Nothing here is used on the VM.
#
#   docker build --target app -t relay-app:rehearsal ../..
#   docker build --target simulator -t relay-sim:rehearsal ../..
#   cp rehearsal.env.example rehearsal.env && ./new-secrets.sh rehearsal.env
#   docker compose --env-file rehearsal.env -f compose.yml -f compose.rehearsal.yml --profile demo up -d
#   RELAY_URL=https://localhost:8443 INSECURE=1 ./verify.sh public
#   docker compose --env-file rehearsal.env -f compose.yml -f compose.rehearsal.yml --profile demo down -v
#
# It runs under its own project name, so it never touches the development stack or its volume.
name: relay-rehearsal

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d webhooks"]
      interval: 5s
      retries: 10
    networks:
      edge:
        ipv4_address: 172.30.0.30

  caddy:
    # Port 443 may be taken on a development machine.
    ports: !override
      - "${REHEARSAL_HTTPS_PORT:-8443}:443"

  app:
    depends_on:
      db:
        condition: service_healthy
