# The platform on Fly.io: API, delivery worker and dashboard in one always-on Machine.
# Deploy from the repository root with scripts/deploy-fly.sh (docs/DEPLOYMENT.md).
app = "webhook-platform-demo"
primary_region = "iad"           # next to Neon's AWS us-east-1
# The JVM drains in-flight deliveries on SIGTERM (worker shutdown-timeout 20s). Fly's defaults are
# SIGINT and 5s, which would cut deliveries off and leave them to the lease reaper.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../../Dockerfile"
  build-target = "app"

[env]
  PORT = "8080"
  LOG_FORMAT = "ecs"
  DATABASE_POOL_SIZE = "10"

[http_service]
  internal_port = 8080
  force_https = true
  # The worker polls PostgreSQL continuously: the Machine must never stop or sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[deploy]
  # Start the new Machine, wait for its health check, then stop the old one. Two workers overlap for
  # a moment, which the queue handles (SKIP LOCKED claims, lease fencing).
  strategy = "bluegreen"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
