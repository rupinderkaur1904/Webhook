# The receiver simulator on Fly.io, deployed separately from the platform. It keeps receiver
# configuration and request logs in memory, so it stays running: a stopped Machine would forget
# them in the middle of a demonstration.
app = "webhook-simulator-demo"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "../../Dockerfile"
  build-target = "simulator"

[env]
  PORT = "9090"

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
