# Local development profile (SPRING_PROFILES_ACTIVE=local). Never use these values in production.
webhooks:
  auth:
    # The local dev server is plain HTTP.
    session-cookie-secure: false
  bootstrap:
    email: dev@localhost
    password: local-dev-password
    api-key: whk_local_dev_key_0000000000000000000000
  secrets:
    # Well-known 32-byte key for local use only; production must set SECRET_ENCRYPTION_KEY.
    encryption-key: bG9jYWwtZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktISE=
  ssrf:
    allowed-hosts:
      - localhost:9090
      - 127.0.0.1:9090
      - simulator:9090
  # A short response timeout so the timeout scenario does not take long to watch.
  delivery:
    response-timeout: 5s
  # Short lease and frequent reaping so the crash demo recovers within seconds. The lease must exceed
  # connect-timeout (5s) + response-timeout (5s) + 5s.
  worker:
    lease-duration: 15s
    reaper-interval: 2s
  # Short delays so retries and exhaustion can be watched live in a demo.
  retry:
    max-attempts: 4
    base-delay: 2s
    max-delay: 20s
    max-retry-after: 60s
  # Short cool-downs so the breaker demo opens, probes and closes within seconds.
  circuit:
    base-cooldown: 5s
    max-cooldown: 1m
  # Prometheus scrape token for local use only (GET /actuator/prometheus).
  metrics:
    token: local-dev-metrics-token-00000000
